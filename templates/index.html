<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PROJETO GRAU 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{overflow:hidden;background:#000;color:#fff}
#hud{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(0,0,0,.8);padding:8px 10px;border-bottom:3px solid #ff6d00}
#h1{display:flex;justify-content:space-between;font-weight:900;font-size:15px}
#h2{display:flex;justify-content:space-between;font-size:11px;color:#ccc;margin-top:3px}
#dinheiro{color:#00e676}#combo{color:#ffca28}
#controles{position:fixed;bottom:0;left:0;right:0;z-index:20;padding:8px;background:linear-gradient(transparent,rgba(0,0,0,.9))}
#barra{width:90%;height:20px;background:#333;margin:4px auto;border-radius:20px;overflow:hidden;border:2px solid #555;position:relative}
#zona{position:absolute;left:30%;width:40%;height:100%;background:#00e676}
#ponteiro{position:absolute;top:0;width:12px;height:100%;background:#fff;left:50%}
#joy{width:120px;height:120px;background:rgba(255,255,255,.2);border:2px solid #fff;border-radius:50%;position:relative;float:left;margin-left:8px}
#bola{width:50px;height:50px;background:#ff6d00;border-radius:50%;position:absolute;left:35px;top:35px}
#botoesDir{float:right;display:grid;grid-template-columns:1fr 1fr;gap:8px;width:205px}
button{padding:13px 4px;font-size:13px;font-weight:900;border:none;border-radius:12px;background:#222;color:#fff}
#btnGrau{background:linear-gradient(#ff6d00,#ff3d00);font-size:17px;grid-column:span 2;padding:18px}
#msg{position:fixed;top:45%;left:0;right:0;text-align:center;font-size:26px;font-weight:900;text-shadow:0 0 10px #000;z-index:30;pointer-events:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.97);display:none;padding:18px;z-index:99;overflow:auto}
#modal button{display:block;width:100%;margin:8px 0;padding:16px;background:#222}
#loading{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:100;font-size:20px;font-weight:900}
</style>
</head>
<body>
<div id="loading">🏍️ CARREGANDO CIDADE 3D...<br><span style="font-size:14px;color:#aaa">Aguarda 3 seg</span></div>
<div id="hud">
<div id="h1"><span>💰 R$ <span id="dinheiro">0</span></span><span>⭐ <span id="pontos">0</span></span><span>🔥 x<span id="combo">1</span></span><span>🏍️ <span id="motoNome">CG 160 3D</span></span></div>
<div id="h2"><span id="vel">0 KM/H</span><span id="pol">POLÍCIA ☆☆☆☆☆</span></div>
<div id="h2"><span id="fuga">MAPA LIVRE 3D</span><span id="serv">Sem serviço</span></div>
</div>
<div id="msg"></div>
<div id="controles">
<div style="text-align:center;font-size:12px">⚖️ EQUILÍBRIO <span id="eqTxt">50%</span></div>
<div id="barra"><div id="zona"></div><div id="ponteiro"></div></div>
<div id="joy"><div id="bola"></div></div>
<div id="botoesDir">
<button id="btnGrau">⬆️ SEGURA GRAU</button>
<button onclick="iniciarFuga()" style="background:#c62828">🚨 FUGA</button>
<button onclick="esconder()" style="background:#2e7d32">🙈 ESCONDER</button>
<button onclick="abrirServicos()" style="background:#2962ff">💼 SERVIÇO</button>
<button onclick="abrirGaragem()" style="background:#7b1fa2">🏍️ GARAGEM</button>
<button onclick="toggleSom()" id="btnSom">🔊 SOM ON</button>
<button onclick="levantar()" style="background:#555">🔄 LEVANTAR</button>
</div><div style="clear:both"></div>
</div>
<div id="modal"><h2 id="modalTitulo"></h2><div id="modalConteudo"></div><button onclick="fecharModal()" style="background:#ff5252">FECHAR</button></div>

<script>
// ===== SOM =====
let audioCtx=null,osc=null,gainNode=null,somLigado=true;
function initSom(){if(audioCtx)return;audioCtx=new (window.AudioContext||window.webkitAudioContext)();osc=audioCtx.createOscillator();gainNode=audioCtx.createGain();osc.type='sawtooth';osc.frequency.value=60;gainNode.gain.value=0;let f=audioCtx.createBiquadFilter();f.type='lowpass';f.frequency.value=900;osc.connect(f);f.connect(gainNode);gainNode.connect(audioCtx.destination);osc.start();}
function toggleSom(){somLigado=!somLigado;document.getElementById('btnSom').innerText=somLigado?'🔊 SOM ON':'🔇 SOM OFF';if(!somLigado&&gainNode)gainNode.gain.value=0;}
function beep(fr,d){if(!somLigado)return;initSom();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=fr;g.gain.value=0.15;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);}

// ===== ESTADO =====
let dinheiro=0,pontos=0,combo=1,equilibrio=50,caiu=false,empinando=false,vel=0,angle=0,tempoEmpinado=0,fugindo=false,estrelas=0,ultimaEstrela=0,inicioFuga=0,servico=null,tempoServico=0,motoAtual=0;
let joyX=0,joyY=0,joyAtivo=false;
let motos=[{nome:'CG 160 3D',cor:0xff3d00,preco:0,pot:1},{nome:'XJ6 3D',cor:0x2962ff,preco:500,pot:1.4},{nome:'MT-03 3D',cor:0x00e676,preco:1500,pot:1.9},{nome:'HORNET 3D',cor:0xffca28,preco:3000,pot:2.5}];

// ===== CENA 3D =====
let scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,80,250);
let camera=new THREE.PerspectiveCamera(65,window.innerWidth/window.innerHeight,0.1,500);
let renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);
renderer.domElement.style.position='fixed';renderer.domElement.style.top='0';renderer.domElement.style.left='0';renderer.domElement.style.zIndex='1';

// Luzes - sol + ambiente igual fim de tarde
let sol=new THREE.DirectionalLight(0xfff2cc,1.1);sol.position.set(50,80,30);sol.castShadow=true;sol.shadow.camera.left=-100;sol.shadow.camera.right=100;sol.shadow.camera.top=100;sol.shadow.camera.bottom=-100;scene.add(sol);
scene.add(new THREE.AmbientLight(0xffffff,0.6));

// Chão grama
let chao=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshLambertMaterial({color:0x2e7d32}));
chao.rotation.x=-Math.PI/2;scene.add(chao);

// Ruas - grade 3D
for(let i=-300;i<=300;i+=100){
 let rua1=new THREE.Mesh(new THREE.BoxGeometry(600,0.2,18),new THREE.MeshLambertMaterial({color:0x222222}));rua1.position.set(0,0.1,i);scene.add(rua1);
 let rua2=new THREE.Mesh(new THREE.BoxGeometry(18,0.2,600),new THREE.MeshLambertMaterial({color:0x222222}));rua2.position.set(i,0.1,0);scene.add(rua2);
 // faixa amarela
 for(let j=-290;j<=290;j+=30){let f=new THREE.Mesh(new THREE.BoxGeometry(4,0.3,1.2),new THREE.MeshBasicMaterial({color:0xffca28}));f.position.set(j,0.2,i);scene.add(f);}
}

// Prédios 3D com janelas
let predios=[];
for(let gx=-2;gx<=2;gx++) for(let gz=-2;gz<=2;gz++){
 if(gx==0&&gz==0) continue;
 let h=15+Math.random()*25;
 let cor=[0x2e2e4d,0x3a2a4d,0x1c3a4d,0x4d2a2a,0x37474f][Math.floor(Math.random()*5)];
 let p=new THREE.Mesh(new THREE.BoxGeometry(28,h,28),new THREE.MeshLambertMaterial({color:cor}));
 p.position.set(gx*100+50,h/2,gz*100+50);p.castShadow=true;p.receiveShadow=true;scene.add(p);predios.push(p);
 // janelas amarelas
 for(let wy=5;wy<h;wy+=5) for(let wx=-10;wx<=10;wx+=7){let j=new THREE.Mesh(new THREE.BoxGeometry(3,3,0.5),new THREE.MeshBasicMaterial({color:Math.random()>0.4?0xffcc00:0x222222}));j.position.set(p.position.x+wx,wy,p.position.z+14.2);scene.add(j);}
 // telhado neon
 let top=new THREE.Mesh(new THREE.BoxGeometry(29,0.6,29),new THREE.MeshBasicMaterial({color:0xff6d00}));top.position.set(p.position.x,h+0.3,p.position.z);scene.add(top);
}
// Árvores 3D
for(let i=0;i<50;i++){
 let tronco=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.8,4),new THREE.MeshLambertMaterial({color:0x5d4037}));let x=(Math.random()-0.5)*500,z=(Math.random()-0.5)*500;tronco.position.set(x,2,z);scene.add(tronco);
 let copa=new THREE.Mesh(new THREE.SphereGeometry(4,8,8),new THREE.MeshLambertMaterial({color:0x2e7d32}));copa.position.set(x,6,z);copa.castShadow=true;scene.add(copa);
}
// Praça central
let praca=new THREE.Mesh(new THREE.CylinderGeometry(28,28,0.5,24),new THREE.MeshLambertMaterial({color:0x8bc34a}));praca.position.set(0,0.2,0);scene.add(praca);

// Moedas 3D - giram
let moedas=[];
for(let i=0;i<30;i++){
 let m=new THREE.Mesh(new THREE.CylinderGeometry(2,2,0.5,16),new THREE.MeshBasicMaterial({color:0xffd700}));
 m.rotation.x=Math.PI/2;m.position.set((Math.random()-0.5)*400,2,(Math.random()-0.5)*400);scene.add(m);moedas.push(m);
}
// Carros 3D
let carros=[];
for(let i=0;i<10;i++){
 let g=new THREE.Group();
 let corpo=new THREE.Mesh(new THREE.BoxGeometry(8,2.5,4),new THREE.MeshLambertMaterial({color:[0xffffff,0xff5252,0x2962ff,0xffca28][i%4]}));corpo.castShadow=true;g.add(corpo);
 let cab=new THREE.Mesh(new THREE.BoxGeometry(4,2,3.5),new THREE.MeshLambertMaterial({color:0x111111}));cab.position.y=2.2;g.add(cab);
 let r1=new THREE.Mesh(new THREE.CylinderGeometry(1,1,0.8),new THREE.MeshLambertMaterial({color:0x000000}));r1.rotation.z=Math.PI/2;r1.position.set(2.5,-1,2.2);g.add(r1);
 let r2=r1.clone();r2.position.set(-2.5,-1,2.2);g.add(r2);
 g.position.set((Math.random()-0.5)*400,1.5,(Math.random()-0.5)*400);g.rotation.y=Math.random()*Math.PI*2;scene.add(g);carros.push({g:g,vel:0.3+Math.random()*0.4});
}
// Polícia 3D
let policias=[];
for(let i=0;i<3;i++){
 let g=new THREE.Group();
 let corpo=new THREE.Mesh(new THREE.BoxGeometry(8,2.5,4),new THREE.MeshLambertMaterial({color:0xffffff}));g.add(corpo);
 let giro=new THREE.Mesh(new THREE.BoxGeometry(2,1,2),new THREE.MeshBasicMaterial({color:0x2962ff}));giro.position.y=2;g.add(giro);
 g.position.set(30+i*10,1.5,30);g.visible=false;scene.add(g);policias.push(g);
}

// ===== MOTO 3D - construída com caixas e cilindros =====
let motoGroup=new THREE.Group();
let motoCor=motos[0].cor;
let tanque=new THREE.Mesh(new THREE.BoxGeometry(4.5,1.5,1.8),new THREE.MeshLambertMaterial({color:motoCor}));tanque.position.y=2.2;motoGroup.add(tanque);
let banco=new THREE.Mesh(new THREE.BoxGeometry(3,0.7,1.6),new THREE.MeshLambertMaterial({color:0x111111}));banco.position.set(-1.2,2.4,0);motoGroup.add(banco);
let motor=new THREE.Mesh(new THREE.BoxGeometry(2.5,2,1.8),new THREE.MeshLambertMaterial({color:0x333333}));motor.position.y=1;motoGroup.add(motor);
let guidon=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,3),new THREE.MeshLambertMaterial({color:0x888888}));guidon.rotation.x=Math.PI/2;guidon.position.set(2.2,3,0);motoGroup.add(guidon);
let rodaMat=new THREE.MeshLambertMaterial({color:0x111111});
let rodaD=new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.4,0.6,16),rodaMat);rodaD.rotation.x=Math.PI/2;rodaD.position.set(2.2,1.4,0);rodaD.castShadow=true;motoGroup.add(rodaD);
let rodaT=new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.4,0.6,16),rodaMat);rodaT.rotation.x=Math.PI/2;rodaT.position.set(-2.2,1.4,0);rodaT.castShadow=true;motoGroup.add(rodaT);
// Piloto 3D - capacete + corpo
let piloto=new THREE.Group();
let capacete=new THREE.Mesh(new THREE.SphereGeometry(0.9,12,12),new THREE.MeshLambertMaterial({color:0xff6d00}));capacete.position.set(-0.3,4.2,0);piloto.add(capacete);
let corpoP=new THREE.Mesh(new THREE.BoxGeometry(1.2,2,1.2),new THREE.MeshLambertMaterial({color:0x222222}));corpoP.position.set(-0.5,2.8,0);piloto.add(corpoP);
motoGroup.add(piloto);
motoGroup.position.set(0,0,0);
scene.add(motoGroup);

// ===== LOOP DO JOGO =====
let clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 let dt=clock.getDelta();
 // movimento
 if(!caiu){
  let acel=-joyY;
  if(acel>0.2) vel=Math.min(28,vel+acel*0.35*motos[motoAtual].pot);
  else if(acel<-0.2) vel=Math.max(-5,vel+acel*0.2);
  else vel*=0.99;
  if(Math.abs(joyX)>0.2 && Math.abs(vel)>0.5) angle+=joyX*0.05*(vel/15);
  motoGroup.position.x+=Math.sin(angle)*vel*dt*3;
  motoGroup.position.z+=Math.cos(angle)*vel*dt*3;
  motoGroup.position.x=Math.max(-280,Math.min(280,motoGroup.position.x));
  motoGroup.position.z=Math.max(-280,Math.min(280,motoGroup.position.z));
  motoGroup.rotation.y=angle;
  rodaD.rotation.z-=vel*dt*2; rodaT.rotation.z-=vel*dt*2;
  if(empinando){tempoEmpinado+=dt;pontos+=dt*10*combo*motos[motoAtual].pot;if(tempoEmpinado>5)combo=2;if(tempoEmpinado>12)combo=3;if(tempoEmpinado>20)combo=5;motoGroup.rotation.x=-0.55; motoGroup.position.y=0.8;} else {tempoEmpinado=0;combo=1;motoGroup.rotation.x=0;motoGroup.position.y=0;}
  if(caiu) motoGroup.rotation.z=Math.PI/2;
  // carros andam
  carros.forEach(c=>{c.g.position.x+=Math.sin(c.g.rotation.y)*c.vel; c.g.position.z+=Math.cos(c.g.rotation.y)*c.vel; if(Math.random()<0.005) c.g.rotation.y+=(Math.random()-0.5); if(c.g.position.distanceTo(motoGroup.position)<6 && vel>3){caiu=true;document.getElementById('msg').innerText='💥 BATEU!';setTimeout(()=>document.getElementById('msg').innerText='',2000);}});
  // moedas giram e pegam
  moedas.forEach(m=>{m.rotation.y+=0.05; if(m.position.distanceTo(motoGroup.position)<4){m.position.set((Math.random()-0.5)*400,2,(Math.random()-0.5)*400);dinheiro+=20;beep(900,0.15);}});
  // policia persegue
  if(fugindo) policias.forEach(p=>{p.visible=true;let dx=motoGroup.position.x-p.position.x,dz=motoGroup.position.z-p.position.z;let d=Math.hypot(dx,dz);p.position.x+=dx/d*0.35;p.position.z+=dz/d*0.35;p.rotation.y=Math.atan2(dx,dz);if(d<7){caiu=true;fugindo=false;estrelas=0;dinheiro=Math.max(0,dinheiro-100);document.getElementById('msg').innerText='🚓 PEGO! -R$100';setTimeout(()=>document.getElementById('msg').innerText='',2500);}});
  else policias.forEach(p=>p.visible=false);
 }
 if(!caiu && !empinando) equilibrio-=0.25;
 equilibrio=Math.max(0,Math.min(100,equilibrio));
 if(empinando && (equilibrio<=8||equilibrio>=92)){caiu=true;document.getElementById('msg').innerText='💥 CAIU DO GRAU!';setTimeout(()=>document.getElementById('msg').innerText='',2000);}
 // camera atrás da moto igual Grau 2
 let camDist=14, camAlt=7;
 let cx=motoGroup.position.x - Math.sin(angle)*camDist;
 let cz=motoGroup.position.z - Math.cos(angle)*camDist;
 camera.position.lerp(new THREE.Vector3(cx,camAlt,cz),0.1);
 camera.lookAt(motoGroup.position.x,motoGroup.position.y+3,motoGroup.position.z);
 // HUD
 document.getElementById('dinheiro').innerText=Math.floor(dinheiro);
 document.getElementById('pontos').innerText=Math.floor(pontos);
 document.getElementById('combo').innerText=combo;
 document.getElementById('motoNome').innerText=motos[motoAtual].nome;
 document.getElementById('vel').innerText=Math.floor(Math.abs(vel)*5)+' KM/H • RPM '+Math.floor(800+Math.abs(vel)*180);
 document.getElementById('pol').innerText='POLÍCIA: '+'★'.repeat(estrelas)+'☆'.repeat(5-estrelas);
 document.getElementById('ponteiro').style.left=equilibrio+'%';
 document.getElementById('eqTxt').innerText=Math.floor(equilibrio)+'%';
 if(empinando && !caiu) document.getElementById('msg').innerText='🔥 GRAU 3D! x'+combo+' - '+Math.floor(tempoEmpinado)+'s';
 if(fugindo){let t=Math.floor((Date.now()-inicioFuga)/1000);document.getElementById('fuga').innerText='🚨 FUGA '+t+'s';if(Date.now()-ultimaEstrela>=30000 && estrelas<5){estrelas++;ultimaEstrela=Date.now();}} else document.getElementById('fuga').innerText='MAPA LIVRE 3D';
 if(servico){tempoServico-=dt;document.getElementById('serv').innerText=servico.nome+' '+Math.ceil(tempoServico)+'s';if(tempoServico<=0){dinheiro+=servico.pago;servico=null;document.getElementById('serv').innerText='Serviço pronto!';}}
 if(audioCtx && somLigado){osc.frequency.setTargetAtTime(50+Math.abs(vel)*8+(empinando?30:0),audioCtx.currentTime,0.1);gainNode.gain.setTargetAtTime(0.04+Math.abs(vel)/28*0.06,audioCtx.currentTime,0.1);}
 renderer.render(scene,camera);
}
setTimeout(()=>{document.getElementById('loading').style.display='none';animate();},1000);

// Joystick
let joy=document.getElementById('joy'),bola=document.getElementById('bola');
function moverJoy(e){let r=joy.getBoundingClientRect();let cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left-60;let cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top-60;let d=Math.hypot(cx,cy);if(d>45){cx=cx/d*45;cy=cy/d*45;}joyX=cx/45;joyY=cy/45;bola.style.left=(35+cx)+'px';bola.style.top=(35+cy)+'px';initSom();}
joy.addEventListener('touchstart',e=>{joyAtivo=true;moverJoy(e);});joy.addEventListener('touchmove',e=>{if(joyAtivo)moverJoy(e);});joy.addEventListener('touchend',()=>{joyX=0;joyY=0;bola.style.left='35px';bola.style.top='35px';});
joy.addEventListener('mousedown',e=>{joyAtivo=true;moverJoy(e);});window.addEventListener('mousemove',e=>{if(joyAtivo)moverJoy(e);});window.addEventListener('mouseup',()=>{joyAtivo=false;joyX=0;joyY=0;bola.style.left='35px';bola.style.top='35px';});

function iniciarFuga(){if(!fugindo){fugindo=true;inicioFuga=Date.now();ultimaEstrela=Date.now();beep(400,0.5);}}
function esconder(){fugindo=false;estrelas=0;vel=0;policias.forEach(p=>{p.position.set(30,1.5,30);});}
function levantar(){caiu=false;equilibrio=50;empinando=false;motoGroup.rotation.z=0;motoGroup.rotation.x=0;}
function abrirServicos(){document.getElementById('modalTitulo').innerText='💼 SERVIÇOS';document.getElementById('modalConteudo').innerHTML=`<button onclick="fazerServico('🛵 Entregador',100,10)">🛵 Entregador R$100 - 10s</button><button onclick="fazerServico('🔧 Mecânico',200,14)">🔧 Mecânico R$200 - 14s</button><button onclick="fazerServico('🏍️ Mototáxi',500,22)">🏍️ Mototáxi R$500 - 22s</button>`;document.getElementById('modal').style.display='block';}
function abrirGaragem(){document.getElementById('modalTitulo').innerText='🏍️ GARAGEM 3D';let h='';motos.forEach((m,i)=>{h+=`<button onclick="comprarMoto(${i})">${m.nome} - ${m.preco==0?'GRÁTIS':'R$'+m.preco} ${i==motoAtual?'✅':''}</button>`;});document.getElementById('modalConteudo').innerHTML=h;document.getElementById('modal').style.display='block';}
function comprarMoto(i){if(dinheiro>=motos[i].preco){if(i!=motoAtual)dinheiro-=motos[i].preco;motoAtual=i;tanque.material.color.setHex(motos[i].cor);fecharModal();}else alert('Falta dinheiro!');}
function fazerServico(n,p,t){servico={nome:n,pago:p};tempoServico=t;fecharModal();}
function fecharModal(){document.getElementById('modal').style.display='none';}
let btn=document.getElementById('btnGrau');
btn.addEventListener('touchstart',e=>{e.preventDefault();initSom();empinando=true;});
btn.addEventListener('touchend',()=>empinando=false);
btn.addEventListener('mousedown',()=>{initSom();empinando=true;});btn.addEventListener('mouseup',()=>empinando=false);
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});
</script>
</body>
</html>
