<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Projeto Grau - City</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
  body{background:#0a0a0a;color:#fff;overflow:hidden}
  #hud{padding:10px;font-weight:bold}
  #cidade{width:100%;height:220px;background:#191932;position:relative;overflow:hidden;border-bottom:4px solid #333}
  .predio{position:absolute;bottom:0;background:#3c3c5a;border:1px solid #555}
  #chao{position:absolute;bottom:0;width:100%;height:30px;background:#333}
  #moto{position:absolute;left:80px;bottom:25px;font-size:55px;transition:transform .1s;z-index:10}
  #policia{position:absolute;left:-80px;bottom:25px;font-size:45px;display:none;z-index:9}
  #barra{width:90%;height:20px;background:#444;margin:10px auto;border-radius:10px;position:relative}
  #zona{position:absolute;left:20%;width:60%;height:100%;background:#00c853}
  #ponteiro{position:absolute;top:-5px;width:12px;height:30px;background:#fff;border-radius:5px;left:50%}
  .botoes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:10px}
  button{padding:18px;font-size:18px;font-weight:bold;border:none;border-radius:12px;background:#222;color:#fff}
  button:active{background:#00c853}
  #btnGrau{background:#ff6d00}
  #btnServico{background:#2962ff}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;padding:20px;z-index:50}
  #modal button{display:block;width:100%;margin:10px 0;background:#333}
</style>
</head>
<body>
<div id="hud">
  <div>💰 R$ <span id="dinheiro">0</span> | ⭐ Pontos Grau: <span id="pontos">0</span></div>
  <div id="estrelas">POLÍCIA: ☆☆☆☆☆</div>
  <div id="fugaInfo">Sem fuga - Aperte FUGA pra testar</div>
  <div id="servicoInfo">Serviço: Nenhum</div>
</div>
<div id="cidade"><div id="chao"></div><div id="policia">🚓</div><div id="moto">🏍️</div></div>
<div style="text-align:center">EQUILÍBRIO - Se sair do verde você cai!</div>
<div id="barra"><div id="zona"></div><div id="ponteiro"></div></div>
<div id="msg" style="text-align:center;color:#ff5252;font-weight:bold;height:22px"></div>
<div class="botoes">
  <button id="btnEsq">◀️</button><button id="btnGrau">⬆️ GRAU</button><button id="btnDir">▶️</button>
  <button id="btnEqEsq">A - EQ</button><button onclick="abrirServicos()" style="background:#2962ff">💼 SERVIÇOS</button><button id="btnEqDir">EQ - D</button>
  <button onclick="iniciarFuga()">🚨 FUGA</button><button onclick="esconder()">🙈 ESCONDER</button><button onclick="levantar()">🔄 LEVANTAR</button>
</div>
<div id="modal">
  <h2>SERVIÇOS - Trabalhe pra ganhar dinheiro</h2><p>Grau NÃO dá dinheiro, só serviço dá!</p>
  <button onclick="fazerServico('Eletricista',120,10)">1 - Eletricista R$120 - 10s</button>
  <button onclick="fazerServico('Entregador',80,8)">2 - Entregador R$80 - 8s</button>
  <button onclick="fazerServico('Mecânico',150,12)">3 - Mecânico R$150 - 12s</button>
  <button onclick="fazerServico('Pintor',100,9)">4 - Pintor R$100 - 9s</button>
  <button onclick="fecharServicos()" style="background:#ff5252">FECHAR</button>
</div>
<script>
let dinheiro=0, pontos=0, equilibrio=50, caiu=false, fugindo=false, estrelas=0, inicioFuga=0, ultimaEstrela=0, servico=null, tempoServico=0;
let cidade=document.getElementById('cidade');
for(let i=0;i<20;i++){ let p=document.createElement('div'); p.className='predio'; p.style.left=(i*160)+'px'; p.style.width='130px'; p.style.height=(100+Math.random()*120)+'px'; cidade.appendChild(p); }
function atualizar(){
  document.getElementById('dinheiro').innerText=dinheiro;
  document.getElementById('pontos').innerText=pontos;
  document.getElementById('estrelas').innerText='POLÍCIA: '+'★'.repeat(estrelas)+'☆'.repeat(5-estrelas);
  document.getElementById('ponteiro').style.left=(equilibrio)+'%';
  document.getElementById('moto').style.transform=`rotate(${(equilibrio-50)*0.8}deg)`;
  document.getElementById('msg').innerText=caiu?'VOCÊ CAIU! Aperte LEVANTAR':'';
  if(fugindo){
    let tempo=Math.floor((Date.now()-inicioFuga)/1000);
    document.getElementById('fugaInfo').innerText=`FUGA: ${tempo}s - Próxima estrela em ${30 - Math.floor((Date.now()-ultimaEstrela)/1000)}s`;
    if(Date.now()-ultimaEstrela>=30000 && estrelas<5){ estrelas++; ultimaEstrela=Date.now(); }
    document.getElementById('policia').style.display='block';
    document.getElementById('policia').style.left=(20+Math.sin(Date.now()/200)*10)+'px';
  } else { document.getElementById('fugaInfo').innerText='Sem fuga'; document.getElementById('policia').style.display='none'; }
  if(servico){
    tempoServico-=0.1;
    document.getElementById('servicoInfo').innerText=`Serviço: ${servico.nome} - ${Math.ceil(tempoServico)}s falta - Vai ganhar R$${servico.pago}`;
    if(tempoServico<=0){ dinheiro+=servico.pago; servico=null; document.getElementById('servicoInfo').innerText='Serviço: Concluído!'; }
  }
}
function iniciarFuga(){ if(!fugindo){ fugindo=true; inicioFuga=Date.now(); ultimaEstrela=Date.now(); } }
function esconder(){ fugindo=false; estrelas=0; }
function levantar(){ caiu=false; equilibrio=50; }
function abrirServicos(){ document.getElementById('modal').style.display='block'; }
function fecharServicos(){ document.getElementById('modal').style.display='none'; }
function fazerServico(nome,pago,tempo){ servico={nome,pago}; tempoServico=tempo; fecharServicos(); }
let segurar=null;
function segurarBtn(fn){ segurar=setInterval(fn,50); }
function soltar(){ clearInterval(segurar); }
document.getElementById('btnGrau').addEventListener('touchstart',()=>segurarBtn(()=>{ if(!caiu){ equilibrio+=1.5; pontos++; if(equilibrio<=5||equilibrio>=95) caiu=true; } }));
document.getElementById('btnGrau').addEventListener('touchend',soltar);
document.getElementById('btnEqEsq').addEventListener('touchstart',()=>segurarBtn(()=>equilibrio-=2));
document.getElementById('btnEqEsq').addEventListener('touchend',soltar);
document.getElementById('btnEqDir').addEventListener('touchstart',()=>segurarBtn(()=>equilibrio+=2));
document.getElementById('btnEqDir').addEventListener('touchend',soltar);
setInterval(()=>{ if(!caiu) equilibrio-=0.3; atualizar(); },100);
atualizar();
</script>
</body>
</html>
